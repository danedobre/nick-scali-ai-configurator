<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nick Scali — AI configurator (example)</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="assets/logo-white.png">
</head>
<body>
  <header class="app-header">
    <img class="logo" src="assets/logo-white.png" alt="Nick Scali">
    <nav class="nav" id="main-nav"></nav>
    <div class="spacer"></div>
    <div class="ex">Example data</div>
    <div class="role">
      <span>View as</span>
      <select id="role-switch" aria-label="Role">
        <option value="despatcher">Despatcher</option>
        <option value="regional" selected>Regional manager</option>
        <option value="admin">Admin</option>
        <option value="global">Global manager</option>
      </select>
    </div>
  </header>
  <div class="flow" id="flow"></div>
  <div id="app"></div>
  <div id="overlay"></div>
  <div id="toasts"></div>
  <script src="js/app.js"></script>
</body>
</html>
